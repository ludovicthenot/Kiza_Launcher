name: Release

# Builds Kiza Setup — the launcher wrapped in its own installer — signs it, and
# publishes it with the manifest the updater reads. Trigger by pushing a tag
# that exactly matches the app version, for example v0.0.305.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: KizaaModEngine-Tauri

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: KizaaModEngine-Tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            KizaaModEngine-Tauri/src-tauri
            KizaaModEngine-Tauri/kiza-setup/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release configuration and tag
        shell: pwsh
        run: |
          node scripts/verify-release-config.js
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match app version v$version."
          }

      - name: Require release secrets
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CURSEFORGE_KEY: ${{ secrets.KIZAMODS_CURSEFORGE_API_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw "Missing required GitHub secret TAURI_SIGNING_PRIVATE_KEY."
          }
          if ([string]::IsNullOrWhiteSpace($env:CURSEFORGE_KEY)) {
            throw "Missing required GitHub secret KIZAMODS_CURSEFORGE_API_KEY."
          }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_TOKEN)) {
            throw "Missing required GitHub secret CLOUDFLARE_API_TOKEN. Without it the release would reach the GitHub fallback but not Cloudflare, and no launcher would ever see it."
          }

      - name: Test the installer
        run: cargo test --manifest-path kiza-setup/src-tauri/Cargo.toml

      - name: Build and sign Kiza Setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KIZAMODS_CURSEFORGE_API_KEY: ${{ secrets.KIZAMODS_CURSEFORGE_API_KEY }}
        run: node scripts/build-installer.mjs

      # Cloudflare first, because Cloudflare is what every launcher reads.
      #
      # Tauri stops at the first endpoint that answers, so publishing to the
      # GitHub fallback while R2 stays behind would leave the fallback ahead of
      # the primary — and never reached. Nobody would see the release at all.
      - name: Publish to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/publish-release.mjs

      # The manifest the updater fetches names the asset by its URL. If the
      # three files below ever go up without each other, running launchers
      # either cannot find the download or reject its signature.
      - name: Publish the GitHub fallback
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $directory = Join-Path (Split-Path $PWD -Parent) "releases/$version"
          $installer = Join-Path $directory "Kiza Launcher_${version}_x64-setup.exe"
          foreach ($file in @($installer, "$installer.sig", (Join-Path $directory 'latest.json'))) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          # The same text the update manifest was built from, rather than a
          # second account of the same release.
          $notes = Join-Path $directory 'NOTES.md'
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --title "Kiza Launcher ${{ github.ref_name }}" `
            --notes-file "$notes" `
            "$installer" "$installer.sig" (Join-Path $directory 'latest.json')
