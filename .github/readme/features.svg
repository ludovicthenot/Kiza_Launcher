  <ellipse cx="1088.0" cy="488" rx="520" ry="260" fill="url(#glow)"/>
  <rect x="20" y="20" width="400" height="214" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="48" y="48" width="48" height="48" rx="14" fill="url(#chip)"/>
  <g transform="translate(60 60)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>
  <text x="48" y="132" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f3ff">A library you arrange</text>
  <text x="48" y="164" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a79fc4"><tspan x="48" dy="0">Hold a card to move it or throw it away.</tspan><tspan x="48" dy="25">Gather instances in folders with their own</tspan><tspan x="48" dy="25">name, colour and picture.</tspan></text>
  <rect x="440" y="20" width="400" height="214" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="468" y="48" width="48" height="48" rx="14" fill="url(#chip)"/>
  <g transform="translate(480 60)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></g>
  <text x="468" y="132" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f3ff">Modpacks in one click</text>
  <text x="468" y="164" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a79fc4"><tspan x="468" dy="0">The right Minecraft version and loader, and</tspan><tspan x="468" dy="25">the pack's own logo as its picture.</tspan></text>
  <rect x="860" y="20" width="400" height="214" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="888" y="48" width="48" height="48" rx="14" fill="url(#chip)"/>
  <g transform="translate(900 60)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></g>
  <text x="888" y="132" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f3ff">Host</text>
  <text x="888" y="164" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a79fc4"><tspan x="888" dy="0">Run a server from an instance or a preset:</tspan><tspan x="888" dy="25">console, players, mods, files and backups.</tspan></text>
  <rect x="20" y="254" width="400" height="214" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="48" y="282" width="48" height="48" rx="14" fill="url(#chip)"/>
  <g transform="translate(60 294)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></g>
  <text x="48" y="366" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f3ff">Crashes explained</text>
  <text x="48" y="398" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a79fc4"><tspan x="48" dy="0">The report names the mod at fault, and sends</tspan><tspan x="48" dy="25">itself if you allow it.</tspan></text>
  <rect x="440" y="254" width="400" height="214" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="468" y="282" width="48" height="48" rx="14" fill="url(#chip)"/>
  <g transform="translate(480 294)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></g>
  <text x="468" y="366" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f3ff">One search</text>
  <text x="468" y="398" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a79fc4"><tspan x="468" dy="0">Modrinth and CurseForge together: mods,</tspan><tspan x="468" dy="25">shaders, resource packs, data packs and</tspan><tspan x="468" dy="25">modpacks.</tspan></text>
  <rect x="860" y="254" width="400" height="214" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="888" y="282" width="48" height="48" rx="14" fill="url(#chip)"/>
  <g transform="translate(900 294)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g>
  <text x="888" y="366" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f3ff">Two engines</text>
  <text x="888" y="398" font-family="Inter, 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#a79fc4"><tspan x="888" dy="0">Java with Fabric, Forge, NeoForge and Quilt,</tspan><tspan x="888" dy="25">or Kizaflux, an experimental engine in Rust.</tspan></text>
  <rect x="0.5" y="0.5" width="1279" height="487" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
