# Kizaflux: the Rust engine Kiza Launcher can run instead of Java (docs/README.md).
#
# Its own workspace, beside src-tauri rather than inside it: the launcher's
# build and tests do not change until the launcher depends on one of these
# crates, and each crate builds and tests alone.
#
# Every dependency here is one the launcher already ships (src-tauri/Cargo.lock),
# at the version it ships, except Flux Bridge's: Horizon's port-pack and what it
# pulls in (docs/audit.md lists their licences).
[workspace]
members = [
    "crates/flux-bridge",
    "crates/flux-core",
    "crates/flux-diagnostics",
    "crates/flux-network",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Nefer"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
base64 = "0.22.1"
ring = "0.17.14"
tempfile = "3.27.0"
