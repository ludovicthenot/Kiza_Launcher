[package]
name = "KizaaMod"
version = "0.0.317"
description = "Kiza Launcher desktop launcher for managed Minecraft instances, mod loaders, mods, APIs, and updates."
authors = ["Nefer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kizaamod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
# Closing the launcher hides it to the tray; the notification is what tells the
# user it is still running rather than gone.
tauri-plugin-notification = "2"
zip = "8.2.0"
walkdir = "2.5.0"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json", "form"] }
quick-xml = { version = "0.38.4", features = ["serialize"] }
futures = { version = "0.3.32", features = ["std", "async-await", "executor"] }
tokio = { version = "1.50.0", features = ["full"] }
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
# Registers the kiza:// and nxm:// schemes with Windows. Without it the code
# that handles those links never receives one.
tauri-plugin-deep-link = "2"
discord-rich-presence = "1.1.0"
# Offline UUIDs are MD5-based, the way UUID.nameUUIDFromBytes builds them.
md5 = "0.7.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
sysinfo = "0.33"
base64 = "0.22.1"
# level.dat is gzipped NBT; the World Vault reads a world's real name from it.
flate2 = "1.1.9"
# The platform keystore is opt-in in keyring v3: without this feature the
# crate silently uses an in-memory mock and nothing is ever persisted.
keyring = { version = "3", features = ["windows-native"] }

# A Windows toast is addressed to an AppUserModelID, not to a process, and one
# Windows cannot resolve is dropped without a word. These are what let Kiza
# register the identifier and stamp it onto its own Start menu shortcut.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-registry = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3.27.0"
