[package]
name = "KizaaMod"
version = "0.0.383"
description = "Kiza Launcher desktop launcher for managed Minecraft instances, mod loaders, mods, APIs, and updates."
authors = ["Nefer"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kizaamod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
# Closing the launcher hides it to the tray; the notification is what tells the
# user it is still running rather than gone.
tauri-plugin-notification = "2"
zip = "8.2.0"
walkdir = "2.5.0"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.13.2", features = ["json", "form", "multipart"] }
quick-xml = { version = "0.38.4", features = ["serialize"] }
futures = { version = "0.3.32", features = ["std", "async-await", "executor"] }
tokio = { version = "1.50.0", features = ["full"] }
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
# Registers the kiza:// and nxm:// schemes with Windows. Without it the code
# that handles those links never receives one.
tauri-plugin-deep-link = "2"
discord-rich-presence = "1.1.0"
# Offline UUIDs are MD5-based, the way UUID.nameUUIDFromBytes builds them.
md5 = "0.7.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
sysinfo = "0.33"
# UPnP on the router, for the one port a hosted server listens on.
igd-next = { version = "0.17", features = ["aio_tokio"] }
base64 = "0.22.1"
# Instance covers are sent to the page at the size a card shows them.
# WebP and GIF: the logos of catalogue modpacks, which become their covers.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# The screenshot gallery's "Copy": the picture itself on the clipboard, so it
# pastes into a message or an editor as an image, not as a file.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# level.dat is gzipped NBT; the World Vault reads a world's real name from it.
flate2 = "1.1.9"
# Whatever archive the reader hands over -- a pack as a .7z, a mod as a .rar,
# an export as a .tar.gz -- is unpacked once into a zip the rest reads.
sevenz-rust2 = "0.23"
unrar = "0.5"
tar = "0.4"
liblzma = { version = "0.4", features = ["static"] }
bzip2 = "0.6"
# Already built for zip; named here to unpack .tar.zst packs.
zstd = "0.13"
tempfile = "3.27.0"
# Kizaflux, the Rust engine an instance can play on instead of Java
# (kizaflux/docs). Its own workspace; every dependency it has is one of these.
flux-core = { path = "../kizaflux/crates/flux-core" }
flux-diagnostics = { path = "../kizaflux/crates/flux-diagnostics" }
flux-network = { path = "../kizaflux/crates/flux-network" }
flux-bridge = { path = "../kizaflux/crates/flux-bridge" }
# The Modrinth App keeps its instance list in an SQLite file; bundled, so a
# machine with no SQLite of its own can still be read.
rusqlite = { version = "0.40", features = ["bundled"] }
# The platform keystore is opt-in in keyring v3: without this feature the
# crate silently uses an in-memory mock and nothing is ever persisted.
keyring = { version = "3", features = ["windows-native"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"

# A Windows toast is addressed to an AppUserModelID, not to a process, and one
# Windows cannot resolve is dropped without a word. These are what let Kiza
# register the identifier and stamp it onto its own Start menu shortcut.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-registry = "0.6"
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3.27.0"
